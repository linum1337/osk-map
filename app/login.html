<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · ОСК</title><link rel="stylesheet" href="/login.css"></head><body><main class="login-card"><img src="/assets/osk-logo.png" alt="OSK group" width="145" height="46"><div class="eyebrow">РАБОЧЕЕ ПРОСТРАНСТВО</div><h1>Вход в портал</h1><p>Выберите пользователя и введите его пароль.</p><form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next_page }}"><label for="login">Пользователь</label><select id="login" name="login" autocomplete="username" required>{% for value,label in options %}<option value="{{ value }}" {% if value==selected %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<button type="submit">Войти</button></form><div class="note">Доступ к разделам и выгрузкам определяется вашей учётной записью.</div></main></body></html>
